<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Contact | Vuong Tran Portfolio</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="style.css" rel="stylesheet" />
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
    <script type="text/javascript">
      (function(){
        emailjs.init({
          publicKey: "g4rbQk9txe6-cbDQC",
        });
      })();
    </script>
    <script src="script.js"></script>
  </head>

  <body>
    <header class="nav_glass">
      <h1 class="main_title">Vuong Tran</h1>
      <nav>
        <ul class="nav_anchors">
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#projects">Projects</a></li>
          <li><a href="index.html#experiences">Experiences</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="contact" class="section">
        <div class="container">
          <h2>Contact</h2>
          <div class="content">
            <p>
              Have a question, an opportunity, or just want to connect? Send
              a message below and I'll get back to you.
            </p>
          </div>
          <form id="contact_form" class="contact_form">
            <div class="form_field">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form_field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form_field">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" required />
            </div>
            <div class="form_field">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                rows="6"
                required
              ></textarea>
            </div>
            <button type="submit" class="form_submit" onclick="sendEmail()">Send Message</button>
            <p class="form_status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
